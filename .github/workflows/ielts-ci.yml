name: IELTS checks

on:
  push:
    branches: [main]
    paths:
      - "work_ielts/**"
      - ".github/workflows/ielts-ci.yml"
  pull_request:
    paths:
      - "work_ielts/**"
      - ".github/workflows/ielts-ci.yml"

permissions:
  contents: read

defaults:
  run:
    working-directory: work_ielts

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: work_ielts/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm run build:server
